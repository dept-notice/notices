<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>자격증 과목 이수 체크</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:0.7rem 0.4rem;background:#fff;color:#111}
.hd-title{font-size:14px;font-weight:600;margin-bottom:2px}
.hd-sub{font-size:10px;color:#666;margin-bottom:8px}
.pg-row{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
.pg-card{background:#f5f5f7;border-radius:8px;padding:5px 3px;text-align:center}
.pg-name{font-size:8px;color:#555;line-height:1.3;min-height:22px;display:flex;align-items:center;justify-content:center;word-break:keep-all}
.pg-num{font-size:16px;font-weight:600;line-height:1}
.pg-tot{font-size:8px;color:#888}
.pb-wrap{height:2px;background:#ddd;border-radius:2px;margin-top:4px;overflow:hidden}
.pb{height:100%;border-radius:2px;transition:width .35s ease}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:9px;width:100%}
th,td{border:0.5px solid #ccc;padding:3px 2px;text-align:center;vertical-align:middle;line-height:1.3}
th{font-weight:500;font-size:8.5px;color:#555;background:#f5f5f7;word-break:keep-all}
td.isu-cell{font-size:9px;font-weight:600;color:#555;writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;padding:4px 2px;letter-spacing:1px}
td.sem-cell{font-size:8px;color:#666;font-weight:500;writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;padding:4px 1px;letter-spacing:0.5px}
td.course-cell{text-align:left;padding-left:4px;font-size:9px;line-height:1.35;word-break:keep-all;white-space:nowrap}
td.course-cell.alt{color:#888;font-style:normal}
td.chk{font-size:8px;transition:background .1s;min-width:22px}
td[data-cert="0"]{--bc:100,149,237}
td[data-cert="1"]{--bc:255,110,155}
td[data-cert="2"]{--bc:90,195,120}
td[data-cert="3"]{--bc:255,160,75}
td[data-cert="4"]{--bc:240,210,50}
th.h0{background:rgba(100,149,237,.18)}
th.h1{background:rgba(255,110,155,.14)}
th.h2{background:rgba(90,195,120,.14)}
th.h3{background:rgba(255,160,75,.14)}
th.h4{background:rgba(240,210,50,.2)}
td.app{background:rgba(var(--bc),.16);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
td.app:active{background:rgba(var(--bc),.35)}
td.app.on{background:rgba(var(--bc),.42)}
td.chk:not(.app){cursor:default}
tr.or-row td{padding:1px 0;font-size:8px;color:#aaa;background:#fafafa;text-align:center;border-left:none;border-right:none}
tr.or-row{height:12px}
td.course-cell.grp{border-left:2px solid rgba(160,160,160,.4)}
.sv-st{font-size:10px;color:#888;text-align:right;margin-top:4px;height:14px}
</style>
</head>
<body>

<div class="hd-title">자격증 과목 이수 체크</div>
<div class="hd-sub">색칠된 칸 클릭 → ● 체크 / 택1은 하나 선택 시 나머지 자동 해제 / 자동저장</div>
<div class="pg-row" id="pgr"></div>
<div class="tbl-wrap">
  <table><thead id="thd"></thead><tbody id="tbd"></tbody></table>
</div>
<div class="sv-st" id="svst"></div>

<script>
const C=[
  {n:'GCU\nTESOL',t:9,bc:'100,149,237'},
  {n:'영어독서\n지도사',t:4,bc:'255,110,155'},
  {n:'영어뮤지컬\n지도사',t:4,bc:'90,195,120'},
  {n:'영어방과후\n지도사',t:5,bc:'255,160,75'},
  {n:'시니어영어\n지도사',t:7,bc:'240,210,50'}
];

const ROWS=[
  {isu:'전필',isuSpan:4,sem:'1·2학기',semSpan:4,n:'언어의 이해'},
  {n:'실전영어회화',group:'G3'},
  {isOr:true},
  {n:'(폐강: 실전영어회화 중급)',group:'G3',alt:true},
  {isu:'전선',isuSpan:16,sem:'1학기',semSpan:8,n:'영어교육의 이해'},
  {n:'영어뮤지컬테크닉과 지도법'},
  {n:'영어교육기획과 경영'},
  {n:'영어발음연습과 지도법'},
  {n:'실용영문법',group:'G1'},
  {isOr:true},
  {n:'(폐강: 실용영문법 연습)',group:'G1',alt:true},
  {n:'팝송으로 배우는 영어와 문화'},
  {sem:'2학기',semSpan:8,n:'스크린영어'},
  {n:'시니어를 위한 실용영어'},
  {n:'영어독서지도법'},
  {n:'교실영어지도법'},
  {n:'놀이로 시작하는 영어교육',group:'G2'},
  {isOr:true},
  {n:'(폐강: 영어교수법의 이론과 실제)',group:'G2',alt:true},
  {n:'영어방과후지도의 이론과 실제'}
];

const GROUPS={G1:[8,10],G2:[16,18],G3:[1,3]};

const APP=new Set([
  '0-0','1-0','3-0','4-0','5-0','6-0','7-0','8-0','10-0','16-0','18-0','19-0',
  '4-1','14-1','15-1','16-1','18-1',
  '4-2','5-2','15-2','16-2','18-2',
  '4-3','5-3','15-3','16-3','18-3','19-3',
  '1-4','3-4','4-4','7-4','8-4','10-4','11-4','12-4','13-4'
]);

const STORE_KEY='cert-chk-v2';
let chks={},stTimer;

function getPartners(ri){
  for(const[,members]of Object.entries(GROUPS)){
    if(members.includes(ri))return members.filter(r=>r!==ri);
  }
  return[];
}

function load(){
  try{const v=localStorage.getItem(STORE_KEY);if(v)chks=JSON.parse(v);}catch(e){chks={};}
  render();
}

function doSave(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(chks));showSt('저장됨 ✓');}catch(e){showSt('저장 실패');}
}

function showSt(m){document.getElementById('svst').textContent=m;clearTimeout(stTimer);stTimer=setTimeout(()=>document.getElementById('svst').textContent='',1800);}
function k(r,c){return r+'-'+c;}

function toggle(ri,ci){
  if(!APP.has(k(ri,ci)))return;
  const newVal=!chks[k(ri,ci)];
  chks[k(ri,ci)]=newVal;
  const cell=document.getElementById('cell-'+ri+'-'+ci);
  if(cell){cell.textContent=newVal?'●':'';cell.classList.toggle('on',newVal);}
  if(newVal){
    for(const pr of getPartners(ri)){
      if(chks[k(pr,ci)]){
        chks[k(pr,ci)]=false;
        const pc=document.getElementById('cell-'+pr+'-'+ci);
        if(pc){pc.textContent='';pc.classList.remove('on');}
      }
    }
  }
  updProg(ci);doSave();
}

function updProg(ci){
  let cnt=0;
  ROWS.forEach((_,ri)=>{if(APP.has(k(ri,ci))&&chks[k(ri,ci)])cnt++;});
  const card=document.getElementById('pg'+ci);if(!card)return;
  card.querySelector('.pg-num').textContent=cnt;
  card.querySelector('.pb').style.width=Math.min(100,Math.round(cnt/C[ci].t*100))+'%';
}

function render(){
  document.getElementById('pgr').innerHTML=C.map((c,i)=>`
    <div class="pg-card" id="pg${i}">
      <div class="pg-name">${c.n.replace('\n','<br>')}</div>
      <div class="pg-num">0</div>
      <div class="pg-tot">/ ${c.t}</div>
      <div class="pb-wrap"><div class="pb" style="width:0%;background:rgba(${c.bc},1)"></div></div>
    </div>`).join('');

  document.getElementById('thd').innerHTML=`<tr>
    <th style="width:16px">이수</th><th style="width:20px">학기</th>
    <th style="text-align:left;padding-left:4px">교과목</th>
    ${C.map((c,i)=>`<th class="h${i}" style="width:22px">${c.n.replace('\n','<br>')}<br><span style="opacity:.7">(${c.t})</span></th>`).join('')}
  </tr>`;

  document.getElementById('tbd').innerHTML=ROWS.map((row,ri)=>{
    if(row.isOr)return`<tr class="or-row"><td colspan="6">── 택 1 ──</td></tr>`;
    const isuTd=row.isu?`<td class="isu-cell" rowspan="${row.isuSpan}">${row.isu}</td>`:'';
    const semTd=row.sem?`<td class="sem-cell" rowspan="${row.semSpan}">${row.sem}</td>`:'';
    const grpClass=row.group?' grp':'';
    const altClass=row.alt?' alt':'';
    const certTds=C.map((_,ci)=>{
      const isApp=APP.has(k(ri,ci));
      return `<td id="cell-${ri}-${ci}" class="chk${isApp?' app':''}" data-cert="${ci}"${isApp?` onclick="toggle(${ri},${ci})"`:''} ></td>`;
    }).join('');
    return `<tr>${isuTd}${semTd}<td class="course-cell${grpClass}${altClass}">${row.n}</td>${certTds}</tr>`;
  }).join('');

  ROWS.forEach((_,ri)=>C.forEach((_,ci)=>{
    const v=chks[k(ri,ci)];
    const cell=document.getElementById('cell-'+ri+'-'+ci);
    if(cell&&v){cell.textContent='●';cell.classList.add('on');}
  }));
  C.forEach((_,ci)=>updProg(ci));
}

load();
</script>
</body>
</html>
